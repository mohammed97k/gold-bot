name: Generate Real Candlestick PDFs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy matplotlib reportlab

      - name: Run PDF Candlestick Generator
        run: python -u export_candles_pdf.py

      - name: Upload Real Candlestick PDFs
        uses: actions/upload-artifact@v4
        with:
          name: gold-real-candles-pack
          path: gold_pdf_candles/
