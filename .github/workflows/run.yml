name: Gold Trading Signals Bot

on:
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests pytz

      - name: Run Test TickerAll
        env:
          TICKERALL_API_KEY: ${{ secrets.TICKERALL_API_KEY }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
        run: python -u test_tickerall.py