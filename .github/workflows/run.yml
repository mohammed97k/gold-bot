name: Generate Candle PDFs

on:
  workflow_dispatch: # يتيح لك تشغيله يدوياً بزر Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas reportlab

      - name: Run PDF Exporter
        run: python -u export_candles_pdf.py

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gold-candle-pdfs
          path: gold_pdf_candles/
