name: Gold Engine Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy matplotlib reportlab

      - name: Run Script
        run: |
          if [ -f export_candles_pdf.py ]; then
            python -u export_candles_pdf.py
          elif [ -f blind_data_miner.py ]; then
            python -u blind_data_miner.py
          else
            python -u data_miner.py
          fi

      - name: Upload PDF Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-candle-pdfs
          path: gold_pdf_candles/
          if-no-files-found: ignore
